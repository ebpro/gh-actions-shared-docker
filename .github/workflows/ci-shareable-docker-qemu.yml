name: Docker QEMU Shareable CI

on:
    workflow_call:    
      inputs:
        runs-on:
          description: The runner to use
          required: false
          default: '[ self-hosted, Linux ]'
          type: string
        env-list:
          description: list of env to produce as json array
          required: false
          default: '[ "" ]'
          type: string

env:
  MSTEAMS_WEBHOOK: ${{ secrets.MSTEAMS_WEBHOOK }}      

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
       matrix:
         ENV: ${{ fromJSON( inputs.env-list ) }}
    env:
       ENV: ${{ matrix.ENV }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
   
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set GITHUB_ENV values
        id: step_one
        run: |
            echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#*\/}" >> $GITHUB_ENV
            echo "TAG_SUFFIX=${VERSION:+-$VERSION}"  >> $GITHUB_ENV
            echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV
            

      - name: Sets Docker metadata
        id: meta
        uses: docker/metadata-action@v5     
        with:
          flavor: |
            latest=auto
            suffix=${{ env.TAG_SUFFIX }}
          images: |
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPOSITORY_NAME }}"
          tags: |
            type=schedule,pattern=nightly
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.description=${{ github.event.repository.description }}            

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Private registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.PRIVATEHUB_HOSTNAME }}
          username: ${{ secrets.PRIVATEHUB_USERNAME }}
          password: ${{ secrets.PRIVATEHUB_TOKEN }}                
    
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:       
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["${{ secrets.DOCKERHUB_PROXY_HOSTNAME }}"]
    #        [registry."${{ secrets.DOCKERHUB_PROXY_HOSTNAME }}"]
    #          http = true              
    #          insecure = true
    #        [registry."${{ secrets.PRIVATEHUB_HOSTNAME }}"]
    #          http = true
    #          insecure = true
    #      driver-opts: |
    #        network=host
    #      buildkitd-flags: |
    #        --debug 
    #        --allow-insecure-entitlement network.host
    #        --allow-insecure-entitlement security.insecure  

    #  - name: Cache Docker layers
    #    uses: actions/cache@v4
    #    with:
    #      path: /opt/cache/buildx-cache
    #      key: ${{ runner.os }}-buildx-${{ github.sha }}
    #      restore-keys: |
    #        ${{ runner.os }}-buildx-  
            
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENV=${{ matrix.ENV }}
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}          
            cache-from: type=registry,ref=${{ secrets.PRIVATEHUB_HOSTNAME }}/${{ env.REPOSITORY_NAME }}:buildcache-
            cache-to: type=registry,ref=${{ secrets.PRIVATEHUB_HOSTNAME }}/${{ env.REPOSITORY_NAME }}:buildcache-${{ github.ref_name }},mode=max,compression=zstd,oci-mediatypes=true
          # cache-from: type=local,src=/opt/cache/buildx-cache
          # cache-to: type=local,dest=/opt/cache/buildx-cache-new,mode=max
          
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}          
     # - # Temp fix
     #   # https://github.com/docker/build-push-action/issues/252
     #   # https://github.com/moby/buildkit/issues/1896
     #   name: Move cache
     #   run: |
     #     rm -rf /opt/cache/buildx-cache
     #     mv /opt/cache/buildx-cache-new /opt/cache/buildx-cache           
      - name: Update repo description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPOSITORY_NAME }}"          
          short-description: ${{ github.event.repository.description }}
